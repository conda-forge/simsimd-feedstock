{% set name = "numkong" %}
{% set version = "7.8.7" %}

package:
  name: numkong-with-alias
  version: {{ version }}

source:
  url: https://github.com/ashvardanian/NumKong/archive/v{{ version }}.tar.gz
  sha256: ace1f9393e99b1e4b60e844d9c9e56f1f1709572817f3a3856d9de37baacdc8e

build:
  number: 1

outputs:
  - name: numkong
    build:
      script: python -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      build:
        - python                                 # [build_platform != target_platform]
        - cross-python_{{ target_platform }}     # [build_platform != target_platform]
        - {{ compiler('c') }}
        - {{ stdlib("c") }}
        - llvm-openmp                    # [osx]
        - libgomp                        # [linux]
      host:
        - python
        - setuptools
        - wheel
        - pip
        - llvm-openmp                    # [osx]
        - libgomp                        # [linux]
      run:
        - python
        - _openmp_mutex

    test:
      requires:
        - pip
      imports:
        - numkong
      commands:
        - pip check

  - name: simsimd
    script: install-simsimd.sh  # [unix]
    script: install-simsimd.bat  # [win]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage(name, exact=True) }}
    test:
      requires:
        - python
        - numpy
      imports:
        - numkong
        - simsimd
      commands:
        - python -c "import simsimd, numpy as np; a = np.ones(4, np.float32); assert bytes(simsimd.wsum(a, a, alpha=2, beta=1)) == (3 * a).tobytes()"

about:
  home: https://github.com/ashvardanian/NumKong
  summary: Portable mixed-precision BLAS-like vector math library for x86 and ARM
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mukhery
